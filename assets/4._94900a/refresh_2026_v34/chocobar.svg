    <path d="M196 170 L214 186 L204 204 L222 222 L208 240 L226 258 L210 276 L228 294 L212 312 L230 332 L262 332 L262 170 Z" fill="url(#gold)" stroke="#9c6f2c" stroke-width="3" stroke-linejoin="round"/>
    <!-- 포장지 몸통 + 찢어진 왼쪽 끝 + 주름 잡힌 오른쪽 끝 -->
    <path d="M226 164 L416 164 L426 176 L436 164 L446 176 L456 164 L456 338 L446 326 L436 338 L426 326 L416 338 L226 338 L238 318 L222 300 L240 282 L224 264 L242 246 L226 228 L244 210 L228 190 L242 174 Z" fill="url(#wrap)" stroke="#7a5a3e" stroke-width="4" stroke-linejoin="round"/>
    <!-- 붉은 띠와 금선 -->
    <rect x="236" y="214" width="190" height="74" fill="url(#band)"/>
    <rect x="236" y="210" width="190" height="6" fill="url(#gold)"/>
    <rect x="236" y="286" width="190" height="6" fill="url(#gold)"/>
