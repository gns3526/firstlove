<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 52 432 432" width="512" height="512">
  <defs>
    <linearGradient id="wrap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.55" stop-color="#f4e6cc"/>
      <stop offset="1" stop-color="#e2c9a2"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8404a"/>
