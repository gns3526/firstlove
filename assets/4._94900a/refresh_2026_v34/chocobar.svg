      <rect x="152" y="188" width="72" height="58" rx="10" fill="url(#piece)"/>
      <rect x="70" y="256" width="72" height="58" rx="10" fill="url(#piece)"/>
      <rect x="152" y="256" width="72" height="58" rx="10" fill="url(#piece)"/>
