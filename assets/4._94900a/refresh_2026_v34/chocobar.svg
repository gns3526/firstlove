    <path d="M330 226 C333 244 336 247 354 251 C336 255 333 258 330 276 C327 258 324 255 306 251 C324 247 327 244 330 226 Z" fill="url(#gold)" stroke="#fff3cf" stroke-width="1.5"/>
    <circle cx="376" cy="236" r="3.5" fill="#fbe7a6"/>
    <circle cx="288" cy="268" r="3" fill="#fbe7a6"/>
    <!-- 광택 -->
    <path d="M250 176 L408 176" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
    <path d="M252 314 L400 314" stroke="#caa77f" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
    <path d="M86 184 L126 184" stroke="#b98663" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
